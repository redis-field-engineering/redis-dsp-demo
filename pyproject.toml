[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-dsp-demo"
version = "0.1.0"
description = "Redis-based DSP candidate generation and reranking prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "redis[hiredis]>=5.2.0,<6.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "numpy>=2.1.0,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "orjson>=3.10.0,<4.0.0",
  "prometheus-client>=0.21.0,<1.0.0",
  "opentelemetry-api>=1.28.0,<2.0.0",
  "opentelemetry-sdk>=1.28.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
  "opentelemetry-instrumentation-redis>=0.49b0,<1.0.0",
  "opentelemetry-exporter-prometheus>=0.49b0,<1.0.0",
  "datasets>=3.1.0,<4.0.0",
  "pyarrow>=18.0.0,<19.0.0",
  "scikit-learn>=1.5.0,<2.0.0",
  "jupyter>=1.1.1,<2.0.0",
  "matplotlib>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.7.0,<1.0.0",
]

[tool.setuptools]
packages = ["app", "data", "experiments", "loadtest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
